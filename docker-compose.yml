services:
  db:
    image: mysql:8.0
    container_name: digimon_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Luk3skywalker!
      MYSQL_DATABASE: digimonomega
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: digimon_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: digimon_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: