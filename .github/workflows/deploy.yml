name: Deploy Automático

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Verificar conexão SSH (porta configurável)
      shell: bash
      env:
        HOST: ${{ secrets.HOST }}
        PORT: ${{ secrets.SSH_PORT || '22' }}
      run: |
        python - <<'PY'
        import os, socket, sys
        host = os.environ["HOST"]
        port = int(os.environ.get("PORT", "22"))
        s = socket.socket()
        s.settimeout(15)
        try:
          s.connect((host, port))
          print("Conexão TCP OK para SSH.")
        except Exception as e:
          print(f"Falha ao conectar via TCP em {host}:{port}: {e}")
          sys.exit(1)
        finally:
          s.close()
        PY

    - name: Acessar VPS e Atualizar
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || '22' }}
        timeout: 120s
        command_timeout: 30m
        debug: true
        script: |
          set -e
          cd ~/digimonomega
          git fetch origin
          git reset --hard origin/main
          docker rm -f main_proxy || true
          docker compose down --remove-orphans || true
          docker network rm digimonomega_default || true
          docker compose build
          docker compose up -d --remove-orphans
          i=0
          until docker compose exec -T db sh -lc 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent' >/dev/null 2>&1; do
            i=$((i+1))
            if [ "$i" -ge 30 ]; then
              echo "Banco não ficou pronto a tempo para rodar migrations."
              docker compose logs --no-color db | tail -n 200 || true
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T backend npm run migrate
